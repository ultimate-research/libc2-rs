[package]
name = "libc2"
version = "0.1.0"
authors = ["ThatNintendoNerd"]
edition = "2024"
description = "Raw FFI bindings to interoperate with Super Smash Bros. Ultimate"
repository = "https://github.com/ultimate-research/libc2-rs"
license = "MIT"

[dependencies]
bitflags = { version = "2.13.2", default-features = false }
hash40 = { version = "1.3.1", default-features = false }
num = "0.4.3"
serde = { version = "1.0.229", features = ["derive"], optional = true }
skyline = { version = "0.6.0", optional = true }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"

[features]
impl = ["dep:skyline"]
serde = ["dep:serde", "bitflags/serde", "hash40/serde"]
